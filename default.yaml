# Paper-aligned MMDCG-DTA configuration
seed: 42
batch_size: 16
validation_ratio: 0.10
num_workers: 0
patience: 50

# Multi-scale graph construction (angstrom)
d_atom_initial: 4.0
d_atom_candidate: 8.0
d_res: 8.0
d_sub: 8.0

# Architecture
raw_atom_dim: 5
sub_x_dim: 5
prot_res_dim: 1
embedding_dim: 64
substructure_embedding_dim: 64
l_intra: 2
l_inter: 2
l_atom: 2
l_sub: 2
inter_negative_slope: 0.2
hil_temperature: 1.0
use_checkpoint: true

# Three-stage optimization
stage1_learning_rate: 0.0001
stage2_learning_rate: 0.00005
stage3_learning_rate: 0.0001
stage1_epochs: 1000
stage2_epochs: 50
stage3_epochs: 1000
inner_max_iterations: 5
inner_tolerance: 0.01
